# Demo deployment for "plateforme-vente-entreprise".
# Reuses the existing pg_container (PostgreSQL) via an external network.
#
# Usage:
#   1. cp .env.production.example .env   then edit values (DB creds, SECRET_KEY)
#   2. Discover the postgres network & set EXTERNAL_NETWORK  (see deploy notes)
#   3. docker compose up -d --build
#   4. Open http://<server-ip>:8080

services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Reach the shared postgres container by its container name on the external network
      DB_HOST: pg_container
      DB_PORT: "5432"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    networks:
      - default
      - pgnet
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Bake a same-origin API base URL into the React bundle
        REACT_APP_API_URL: /api
    ports:
      - "8080:80"
    volumes:
      - media_data:/usr/share/nginx/media:ro
    networks:
      - default
    restart: unless-stopped
    depends_on:
      - backend

networks:
  default:
    name: ventes-net
  pgnet:
    # The Docker network that pg_container is attached to.
    # Override via EXTERNAL_NETWORK in .env (e.g. genext_default, bridge, ...).
    external: true
    name: ${EXTERNAL_NETWORK:-bridge}

volumes:
  media_data:
  static_data:
