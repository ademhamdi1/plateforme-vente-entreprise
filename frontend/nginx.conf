server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # ---- React SPA ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---- Proxy Django app + API to the backend container ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /redoc/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ---- Static assets ----
    # CRA builds the React bundle under /static/ (same prefix Django uses for its
    # admin/DRF static), so serve files from the React build first; if the file
    # doesn't exist locally, fall back to Django (whitenoise) for /static/admin/*,
    # /static/rest_framework/*, /static/drf_yasg/*, etc.
    location /static/ {
        root /usr/share/nginx/html;
        try_files $uri @django_static;
    }
    location @django_static {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # User-uploaded media (shared volume written by backend)
    location /media/ {
        alias /usr/share/nginx/media/;
    }
}
