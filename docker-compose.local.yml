# LOCAL SMOKE TEST ONLY - do not use on the server.
# Self-contained: spins up its own throwaway Postgres (no pg_container needed).
#   docker compose -f docker-compose.local.yml up -d --build
#   open http://localhost:8080
#   docker compose -f docker-compose.local.yml down -v

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: entreprises_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localtest
    volumes:
      - local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ventes_local]

  backend:
    build: ./backend
    environment:
      SECRET_KEY: local-smoke-test-key-not-secret
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DB_NAME: entreprises_db
      DB_USER: postgres
      DB_PASSWORD: localtest
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8080
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin123
    volumes:
      - local_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks: [ventes_local]

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    ports:
      - "8080:80"
    volumes:
      - local_media:/usr/share/nginx/media:ro
    depends_on:
      - backend
    networks: [ventes_local]

networks:
  ventes_local:

volumes:
  local_pgdata:
  local_media:
